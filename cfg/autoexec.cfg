echo "==== LOADING CS2 META WINRATE AUTOEXEC (60HE) ===="

//// SENS (SET ONCE)
sensitivity "1.2"
zoom_sensitivity_ratio "0.818933027"

//// MOVEMENT / INPUT
bind "w" "+mfwd"
bind "a" "+mleft"
bind "s" "+mback"
bind "d" "+mright"
bind "space" "+jump"
bind "mwheelup" "+jump"
bind "mwheeldown" "+reload"
bind "c" "+duck"
bind "shift" "+sprint"

//// JUMPTHROW (ALT) - MM/Faceit safe
alias "+jt" "+jump; -attack; -attack2"
alias "-jt" "-jump"
bind "alt" "+jt"

//// FAST STOP (MOUSE5)
alias "faststop" "slot1; -forward; -back; -left; -right"
bind "mouse5" "faststop"

//// CORE BINDS
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "e" "+use"
bind "g" "drop"
bind "t" "+spray_menu"

//// PUSH-TO-TALK (CAPS)
bind "capslock" "+voicerecord"

//// UTILITY META (FAST ACCESS)
//// Q=SMOKE  R=HE  F=FLASH  X=MOLLY/INC  Z=DECOY
alias "+smoke" "use weapon_smokegrenade"
alias "-smoke" ""
bind "q" "+smoke"

alias "+he" "use weapon_hegrenade"
alias "-he" ""
bind "r" "+he"

alias "+flash" "use weapon_flashbang"
alias "-flash" ""
bind "f" "+flash"

alias "+molly" "use weapon_molotov; use weapon_incgrenade"
alias "-molly" ""
bind "x" "+molly"

alias "+decoy" "use weapon_decoy"
alias "-decoy" ""
bind "z" "+decoy"

//// RADAR (HOLD ZOOM ON N)
cl_radar_always_centered "0"
cl_radar_scale "0.4"
cl_radar_icon_scale_min "0.55"
alias "+radarzoom" "cl_radar_scale 0.7"
alias "-radarzoom" "cl_radar_scale 0.4"
bind "n" "+radarzoom"

//// HUD (CLEAN)
hud_scaling "0.95"
cl_use_opens_buy_menu "0"
cl_teammate_colors_show "1"

//// AUDIO (CLEAN / COMP)
snd_mixahead "0.05"
snd_musicvolume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0"
snd_tensecondwarning_volume "0.05"
snd_mvp_volume "0.1"
snd_deathcamera_volume "0"
snd_mapobjective_volume "0"
voice_modenable "1"
snd_voipvolume "1.0"

//// NET
rate "786432"

//// FPS CAP (HIGH REFRESH CONSISTENCY)
fps_max "477"
cl_showfps "0"

//// MISC
gameinstructor_enable "0"

host_writeconfig
echo "=== CS2 META WINRATE AUTOEXEC LOADED (60HE / MM-SAFE) ==="
